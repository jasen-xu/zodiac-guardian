<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三沙清凉寺祈福 - 易道</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: #0E0C08;
        }

        .pray-page {
            position: relative;
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
            background: #0E0C08;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 佛像图：铺满全屏，不留黑边 */
        .pray-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 右上竖排题字 */
        .pray-inscription {
            position: absolute;
            top: 28px;
            right: 18px;
            z-index: 5;
            writing-mode: vertical-rl;
            font-size: 16px;
            letter-spacing: 6px;
            line-height: 1.9;
            color: #D4AF37;
            text-shadow: 0 1px 6px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        /* 底部左：楞严咒标识；右：寺院介绍入口 */
        .pray-foot {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 34px 18px 20px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            background: linear-gradient(0deg, rgba(14,12,8,0.82), rgba(14,12,8,0));
            z-index: 5;
        }

        .pray-foot .mantra-label {
            font-size: 14px;
            letter-spacing: 3px;
            color: #D4AF37;
            text-shadow: 0 1px 6px rgba(0,0,0,0.8);
        }

        .pray-foot .intro-link {
            font-size: 13px;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.82);
            text-decoration: none;
            border-bottom: 1px solid rgba(212,175,55,0.6);
            padding-bottom: 2px;
        }

        /* 播放控制按钮（自动播放被浏览器拦截时显示） */
        .pray-play-btn {
            position: absolute;
            left: 50%;
            bottom: 130px;
            transform: translateX(-50%);
            z-index: 10;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid #D4AF37;
            background: rgba(212,175,55,0.18);
            color: #D4AF37;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 22px rgba(212,175,55,0.45);
        }

        .pray-play-hint {
            position: absolute;
            left: 50%;
            bottom: 104px;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 12px;
            color: rgba(255,255,255,0.75);
            letter-spacing: 2px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="pray-page">
        <!-- 佛像：铺满全屏 -->
        <img src="images/sansha-guanyin.jpg" alt="千手观音圣像" class="pray-image">
    
        <!-- 楞严咒音频：默认自动播放、循环 -->
        <audio id="prayAudio" autoplay loop preload="auto">
            <source src="audio/sansha-lengyan.m4a" type="audio/mp4">
        </audio>
    
        <!-- 自动播放被拦截时的兜底按钮 -->
        <button class="pray-play-btn" id="prayPlayBtn" aria-label="播放楞严咒">▶</button>
        <span class="pray-play-hint" id="prayPlayHint">点击播放楞严咒</span>
    
        <!-- 右上竖排题字 -->
        <p class="pray-inscription">一心祈福 梵音清凉</p>
    
        <!-- 底部：左楞严咒 / 右寺院介绍入口 -->
        <div class="pray-foot">
            <span class="mantra-label">《楞严咒》</span>
            <a href="temple-detail.html?id=qingliang-temple" class="intro-link">三沙清凉寺介绍</a>
        </div>
    </div>

    <script src="js/toast.js"></script>
    <script>
        (function () {
            var audio = document.getElementById('prayAudio');
            var btn = document.getElementById('prayPlayBtn');
            var hint = document.getElementById('prayPlayHint');
            var playing = false;

            function setPlaying(state) {
                playing = state;
                btn.textContent = state ? '❚❚' : '▶';
            }

            // 尝试自动播放；被浏览器策略拦截时显示播放按钮
            var p = audio.play();
            if (p && p.catch) {
                p.catch(function () {
                    btn.style.display = 'flex';
                    hint.style.display = 'block';
                });
            }
            audio.addEventListener('play', function () { setPlaying(true); });
            audio.addEventListener('pause', function () { setPlaying(false); });

            btn.addEventListener('click', function () {
                if (audio.paused) {
                    audio.play().then(function () {
                        btn.style.display = 'flex';
                        hint.style.display = 'none';
                    });
                } else {
                    audio.pause();
                }
            });
        })();
    </script>
</body>
</html>
