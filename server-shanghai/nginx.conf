# 易道管理后台 Nginx 配置
# 放置位置: /etc/nginx/sites-available/yidao-admin
# 然后: sudo ln -s /etc/nginx/sites-available/yidao-admin /etc/nginx/sites-enabled/

# HTTP：全部重定向到 HTTPS（证书已配置，强制加密访问）
server {
    listen 80;
    server_name admin.yi-yao.net;
    return 301 https://$server_name$request_uri;
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    server_name admin.yi-yao.net;

    # 腾讯云免费 SSL 证书（DNS 验证签发，有效期 90 天，到期需重新申请替换）
    ssl_certificate     /etc/nginx/ssl/admin.yi-yao.net_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/admin.yi-yao.net.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 商品图片上传需要较大的请求体上限（nginx 默认仅 1m）
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }
}
