<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易道管理后台 - 用户管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fa; color: #333; }
        .navbar { background: #1a1a2e; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
        .navbar-brand { color: white; font-size: 18px; font-weight: 700; }
        .navbar-nav { display: flex; gap: 24px; align-items: center; }
        .navbar-nav a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 14px; }
        .navbar-nav a:hover, .navbar-nav a.active { color: white; }
        .logout-btn { background: rgba(255,255,255,0.1); border: none; color: rgba(255,255,255,0.8); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .page-title { font-size: 22px; font-weight: 600; }
        .filters { display: flex; gap: 12px; flex-wrap: wrap; }
        .filter-select, .filter-input { padding: 8px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: white; outline: none; }
        .filter-input { width: 180px; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; font-size: 13px; color: #888; border-bottom: 1px solid #eee; font-weight: 500; white-space: nowrap; }
        td { padding: 12px; font-size: 14px; border-bottom: 1px solid #f5f5f5; }
        tr:hover td { background: #fafafa; }
        .level-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; cursor: pointer; }
        .level-l0 { background: #f5f5f5; color: #999; }
        .level-l1 { background: #e3f2fd; color: #1976d2; }
        .level-l2 { background: #fff3e0; color: #f57c00; }
        .level-l3 { background: #fce4ec; color: #c62828; }
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
        .pagination button { padding: 8px 14px; border: 1px solid #ddd; border-radius: 6px; background: white; cursor: pointer; font-size: 13px; }
        .pagination button.active { background: #1a1a2e; color: white; border-color: #1a1a2e; }
        .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
        .empty-state { text-align: center; padding: 40px; color: #999; }
        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 12px; }
            .page-header { flex-direction: column; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">易道管理后台</div>
        <div class="navbar-nav">
            <a href="/admin">仪表盘</a>
            <a href="/admin/bookings">预约管理</a>
            <a href="/admin/users" class="active">用户管理</a>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
    </nav>
    <div class="container">
        <div class="page-header">
            <h1 class="page-title">用户管理</h1>
            <div class="filters">
                <select class="filter-select" id="levelFilter" onchange="loadUsers(1)">
                    <option value="">全部等级</option>
                    <option value="l0">游客</option>
                    <option value="l1">注册用户</option>
                    <option value="l2">会员</option>
                    <option value="l3">VIP</option>
                </select>
                <input class="filter-input" id="searchInput" placeholder="搜索手机号/昵称" onkeyup="debounceSearch()">
            </div>
        </div>
        <div class="card">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>手机号</th>
                            <th>昵称</th>
                            <th>等级</th>
                            <th>解卦次数</th>
                            <th>注册时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="usersTable">
                        <tr><td colspan="7" class="empty-state">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>
    <script>
        let currentPage = 1;
        let searchTimer = null;

        async function loadUsers(page) {
            currentPage = page || 1;
            const level = document.getElementById('levelFilter').value;
            const search = document.getElementById('searchInput').value.trim();
            const params = new URLSearchParams({ page: currentPage, limit: 20 });
            if (level) params.set('level', level);
            if (search) params.set('search', search);

            try {
                const resp = await fetch(`/admin/api/users?${params}`);
                const result = await resp.json();
                if (!result.success) {
                    if (result.error === '未登录') window.location.href = '/admin/login';
                    return;
                }
                const { users, pagination } = result.data;
                renderTable(users);
                renderPagination(pagination);
            } catch (e) {
                console.error('加载失败:', e);
            }
        }

        function renderTable(users) {
            if (users.length === 0) {
                document.getElementById('usersTable').innerHTML = '<tr><td colspan="7" class="empty-state">暂无用户数据</td></tr>';
                return;
            }
            document.getElementById('usersTable').innerHTML = users.map(u => `
                <tr>
                    <td>#${u.id}</td>
                    <td>${esc(u.phone)}</td>
                    <td>${esc(u.nickname || '-')}</td>
                    <td><span class="level-badge level-${u.level}" onclick="cycleLevel(${u.id}, '${u.level}')">${esc(u.levelName)}</span></td>
                    <td>${u.usage?.divine || 0} 解卦 / ${u.usage?.bazi || 0} 八字</td>
                    <td>${formatTime(u.created_at)}</td>
                    <td>
                        <select onchange="changeLevel(${u.id}, this.value)" style="font-size:12px;padding:2px 4px;border:1px solid #ddd;border-radius:4px;">
                            <option value="" disabled selected>调整等级</option>
                            <option value="l0">游客</option>
                            <option value="l1">注册用户</option>
                            <option value="l2">会员</option>
                            <option value="l3">VIP</option>
                        </select>
                    </td>
                </tr>
            `).join('');
        }

        function renderPagination(p) {
            if (p.pages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
            let html = `<button ${p.page<=1?'disabled':''} onclick="loadUsers(${p.page-1})">上一页</button>`;
            for (let i = 1; i <= p.pages && i <= 7; i++) {
                html += `<button class="${i===p.page?'active':''}" onclick="loadUsers(${i})">${i}</button>`;
            }
            html += `<button ${p.page>=p.pages?'disabled':''} onclick="loadUsers(${p.page+1})">下一页</button>`;
            document.getElementById('pagination').innerHTML = html;
        }

        async function cycleLevel(id, currentLevel) {
            const order = ['l0', 'l1', 'l2', 'l3'];
            const next = order[(order.indexOf(currentLevel) + 1) % order.length];
            await changeLevel(id, next);
        }

        async function changeLevel(id, level) {
            await fetch(`/admin/api/users/${id}/level`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ level })
            });
            loadUsers(currentPage);
        }

        function debounceSearch() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => loadUsers(1), 400);
        }

        function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }
        function formatTime(t) { if(!t) return '-'; const d=new Date(t); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; }
        async function logout() { await fetch('/admin/api/logout',{method:'POST'}); window.location.href='/admin/login'; }

        loadUsers(1);
    </script>
</body>
</html>
